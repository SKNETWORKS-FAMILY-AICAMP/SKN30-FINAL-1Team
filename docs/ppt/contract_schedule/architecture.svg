<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>계약·일정 관리 에이전트 아키텍처</title>
<desc>업무 변경에서 미팅 추천과 사용자 선택으로 이어지는 흐름, 브리핑 자동 갱신과 자료 조회 구조.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#345578"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#12263f}.title{font-size:40px;font-weight:700}.heading{font-size:27px;font-weight:700}.body{font-size:23px;fill:#435b75}.note{font-size:20px;fill:#5f7185}.section{font-size:23px;font-weight:700;fill:#1b5fb0}.line{fill:none;stroke:#345578;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1600" height="1120" fill="white"/>
<text x="60" y="70" class="title">계약·일정 관리 에이전트 아키텍처</text>
<text x="60" y="112" class="body">영업현황으로 미팅을 추천하고, 자료 변경에 맞춰 준비용 브리핑을 갱신합니다.</text>
<text x="60" y="155" class="section">01  업무 변경 → 미팅 추천 → 사용자 선택</text>
<rect x="60" y="180" width="260" height="180" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="82" y="224" class="heading">업무 이벤트</text>
<text x="82" y="268" class="body">보고서 확정 · 딜 변경</text>
<text x="82" y="302" class="body">일정 등록 · CS 처리</text>
<rect x="365" y="180" width="260" height="180" rx="12" fill="#e7f0ff" stroke="#1b5fb0" stroke-width="2"/>
<text x="387" y="224" class="heading">계약관리 Agent</text>
<text x="387" y="268" class="body">영업현황 · 위험 확인</text>
<text x="387" y="302" class="body">미팅 필요성 · 이유 제안</text>
<rect x="670" y="180" width="260" height="180" rx="12" fill="#e7f0ff" stroke="#1b5fb0" stroke-width="2"/>
<text x="692" y="224" class="heading">일정관리 Agent</text>
<text x="692" y="268" class="body">기존 일정 · 요청 조건</text>
<text x="692" y="302" class="body">후보 생성 · 조건 검사</text>
<rect x="975" y="180" width="260" height="180" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="997" y="224" class="heading">추천 저장·조회</text>
<text x="997" y="268" class="body">유효 후보 최대 5개</text>
<text x="997" y="302" class="body">캘린더에서 확인</text>
<rect x="1280" y="180" width="260" height="180" rx="12" fill="#fff5df" stroke="#b78022" stroke-width="2"/>
<text x="1302" y="224" class="heading">사용자 선택</text>
<text x="1302" y="268" class="body">후보 선택 · 일정 등록</text>
<text x="1302" y="302" class="body">중복 등록 방지</text>
<path d="M320 270H355" class="line"/>
<path d="M625 270H660" class="line"/>
<path d="M930 270H965" class="line"/>
<path d="M1235 270H1270" class="line"/>
<text x="60" y="395" class="note">미팅 제안이나 유효 후보가 없으면 추천 없이 종료될 수 있습니다.</text>
<text x="60" y="460" class="section">02  자료·일정 변경 → 브리핑 갱신 예약</text>
<rect x="60" y="485" width="430" height="165" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="82" y="529" class="heading">갱신 트리거</text>
<text x="82" y="573" class="body">자료 처리 · 요약 승인 · 삭제</text>
<text x="82" y="607" class="body">미팅 · 자료 연결 · 딜 정보 변경</text>
<rect x="540" y="485" width="470" height="165" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="562" y="529" class="heading">서버가 갱신 예약</text>
<text x="562" y="573" class="body">변경과 관련된 미팅 확인</text>
<text x="562" y="607" class="body">동일한 자료 상태의 중복 요청 방지</text>
<rect x="1060" y="485" width="480" height="165" rx="12" fill="#eef7ef" stroke="#3f8a55" stroke-width="2"/>
<text x="1082" y="529" class="heading">AgentRun 큐 · worker</text>
<text x="1082" y="573" class="body">예약된 브리핑 생성 작업 실행</text>
<text x="1082" y="607" class="body">생성 중 자료가 바뀌면 후속 갱신</text>
<path d="M490 568H530" class="line"/>
<path d="M1010 568H1050" class="line"/>
<path d="M1410 360V420H775V475" class="line"/>
<text x="970" y="410" class="note">일정 등록 후 브리핑 예약</text>
<text x="60" y="722" class="section">03  자료 확인 → 브리핑 생성 → 미팅 상세</text>
<rect x="60" y="750" width="410" height="145" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="82" y="794" class="heading">관련 자료 검색</text>
<text x="82" y="838" class="body">키워드 + 벡터 검색(RAG)</text>
<text x="82" y="872" class="body">상위 5개 청크 · 열람 권한 확인</text>
<rect x="60" y="915" width="410" height="125" rx="12" fill="#f3f7fc" stroke="#7991ad" stroke-width="2"/>
<text x="82" y="959" class="heading">제품 자료 조회</text>
<text x="82" y="1003" class="body">딜 상품 · 견적 품목의 연결 자료</text>
<rect x="540" y="750" width="470" height="145" rx="12" fill="#e7f0ff" stroke="#1b5fb0" stroke-width="2"/>
<text x="562" y="794" class="heading">계약관리 Agent</text>
<text x="562" y="838" class="body">일정 · 영업현황 · 검색 자료 활용</text>
<text x="562" y="872" class="body">미팅 준비용 브리핑 생성</text>
<rect x="1060" y="750" width="480" height="145" rx="12" fill="#fff5df" stroke="#b78022" stroke-width="2"/>
<text x="1082" y="794" class="heading">미팅 상세</text>
<text x="1082" y="838" class="body">브리핑 · 제품 자료 · 관련 자료</text>
<text x="1082" y="872" class="body">저장된 결과를 함께 표시</text>
<path d="M470 822H530" class="line"/>
<path d="M1010 822H1050" class="line"/>
<path d="M1300 650V685H775V740" class="line"/>
<path d="M470 980H1300V905" class="line"/>
<text x="600" y="963" class="note">제품 자료는 연결 관계로 조회해 브리핑과 함께 저장</text>
<text x="540" y="1025" class="note">갱신 중에도 기존 브리핑 표시 · 실패 시 마지막 성공 결과 유지</text>
</svg>
