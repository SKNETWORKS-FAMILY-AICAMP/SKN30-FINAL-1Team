<html lang="ko">

<title>브리핑 평가 결과 확인</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --ink: #1c2333; --muted: #5f6b7f; --line: #dfe5ee;
  --navy: #1e2761; --teal: #028090; --amber: #b5750b; --red: #c0392b; --green: #1f8a5b;
  --good-bg: #e6f4ec; --mid-bg: #fbf0dc; --bad-bg: #fbe4e1; --soft: #eef3fc; --tealbg: #e3f2f2;
  --mark: #fff3b0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --panel: #1a202b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #2c3444;
    --navy: #9fb3ff; --teal: #4fd0be; --amber: #f0b45c; --red: #ff8a7a; --green: #6fd29a;
    --good-bg: #16332a; --mid-bg: #3a2e14; --bad-bg: #3d1f1c; --soft: #1f2a3f; --tealbg: #173334;
    --mark: #5a4c12;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
header h1 { font-size: 17px; margin: 0; color: var(--navy); }
.stat { color: var(--muted); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .label { font-size: 12px; color: var(--muted); margin-left: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 3px 11px; font-size: 12.5px; cursor: pointer; }
.chip.on { background: var(--navy); color: var(--panel); border-color: var(--navy); }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 60px); }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; max-height: calc(100vh - 60px);
  position: sticky; top: 60px; }
.case { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.case:hover { background: var(--soft); }
.case.sel { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy); }
.case .row1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.case .sub { color: var(--muted); font-size: 12px; }
.pct { font-variant-numeric: tabular-nums; border-radius: 6px; padding: 0 7px; font-size: 13px; }
.good { background: var(--good-bg); color: var(--green); }
.mid { background: var(--mid-bg); color: var(--amber); }
.bad { background: var(--bad-bg); color: var(--red); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--bad-bg); color: var(--red); }
.tag.info { background: var(--soft); color: var(--navy); }

.casehead h2 { margin: 0 0 4px; font-size: 18px; }
.crit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
.crit div { background: var(--soft); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; }
.crit b { font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 14px; align-items: start; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.col > h3 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 60px;
  background: var(--panel); border-radius: 10px 10px 0 0; z-index: 2; }
.col > h3 .step { color: var(--muted); font-weight: 500; font-size: 12px; }
.colbody { padding: 10px 14px; max-height: calc(100vh - 150px); overflow-y: auto; }
.rep { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.rep > summary { list-style: none; cursor: pointer; padding: 7px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rep > summary::-webkit-details-marker { display: none; }
.rep .date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.rep .rt { font-weight: 600; font-size: 13px; }
.rep .inner { padding: 0 10px 10px; font-size: 13px; white-space: pre-wrap; }
.rep .deal { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.rep .deal b { color: var(--teal); }
.rep.flash { outline: 2px solid var(--amber); }
.badge { font-size: 11px; border-radius: 4px; padding: 0 6px; }
.b-recent { background: var(--tealbg); color: var(--teal); }
.b-rag { background: var(--soft); color: var(--muted); }
.b-core { background: var(--mid-bg); color: var(--amber); }
.b-ev { background: var(--navy); color: var(--panel); }
.meeting { background: var(--soft); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 10px; }
.hl { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.hl .num { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: var(--panel);
  text-align: center; font-size: 12px; line-height: 20px; margin-right: 6px; }
.hl .ht { font-weight: 600; }
.hl .hb { font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
.hl ul { margin: 4px 0 6px; padding-left: 18px; font-size: 12.5px; }
.ref { display: inline-block; font-size: 11.5px; background: var(--soft); color: var(--navy); border-radius: 4px;
  padding: 0 6px; margin: 2px 4px 0 0; cursor: pointer; border: 0; }
.excerpt { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin-top: 4px; }
.sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; letter-spacing: .02em; }
.g { border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; border: 1px solid var(--line); }
.g .gt { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.g .why { color: var(--muted); font-size: 12px; margin-top: 3px; }
.v-covered { background: var(--good-bg); }
.v-partial { background: var(--mid-bg); }
.v-missed, .v-bad { background: var(--bad-bg); }
.vl { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; background: var(--panel); }
.miss li { font-size: 12.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }
mark { background: var(--mark); color: inherit; }
@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .colbody { max-height: none; } .col > h3 { position: static; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: 280px; border-right: 0; border-bottom: 1px solid var(--line); }
  header { position: static; } main { padding: 12px 16px 30px; }
}
</style>

  const counts = {good: 0, mid: 0, bad: 0}; rows.forEach(c => counts[grade(c.percent)]++);
  document.getElementById("stat").textContent =
    `${rows.length} / ${DATA.length}건 · 평균 ${avg}% · 잘 나옴 ${counts.good} · 보통 ${counts.mid} · 못 나옴 ${counts.bad}`;
  const list = document.getElementById("list");
  list.innerHTML = rows.length ? "" : '<div class="empty">조건에 맞는 케이스가 없습니다.</div>';
  for (const c of rows) {
    const el = document.createElement("div");
    el.className = "case" + (state.sel === c.name ? " sel" : "");
    el.innerHTML = `<div class="row1"><span>${esc(c.chainName)} · ${c.depth}회</span>
      <span class="pct ${grade(c.percent)}">${c.percent}%</span></div>
      <div class="sub">${esc(c.chainKind)} · ${c.total}/${c.max}점</div>
      <div class="tags">${c.flags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>`;
    el.onclick = () => { state.sel = c.name; renderList(); renderCase(c); };
    list.appendChild(el);
  }
}

function renderCase(c) {
  const main = document.getElementById("main");
  const m = c.meeting, contact = m.customer_contact || {};
  const ev = new Set(c.evidenceIds);
  const crit = Object.entries(c.criteria).map(([k, v]) =>
    `<div>${CRIT[k] || k}<br><b>${v.weighted}</b> / ${v.weight}${v.rating != null ? ` · ${v.rating}/4` : ""}</div>`).join("");

  const reports = c.reports.length ? c.reports.map(r => `
    <details class="rep" id="rep-${esc(r.id)}" ${ev.has(r.id) ? "open" : ""}>
      <summary><span class="date">${esc(r.date)}</span><span class="rt">${esc(r.title)}</span>
        <span class="badge ${r.window === "recent" ? "b-recent" : "b-rag"}">${r.window === "recent" ? "최근 3건" : "RAG로만 닿음"}</span>
        ${r.kind === "core" ? '<span class="badge b-core">핵심</span>' : ""}
        ${ev.has(r.id) ? '<span class="badge b-ev">정답 근거</span>' : ""}</summary>
      <div class="inner">${esc(r.common)}${r.deals.map(d => `<div class="deal"><b>${esc(d.title)}</b>\n${esc(d.body)}</div>`).join("")}</div>
    </details>`).join("") : '<div class="empty">첫 미팅이라 이전 보고서가 없습니다.</div>';

  const docs = c.docs.length ? `<div class="sec">참고 문서</div>` + c.docs.map(d =>
    `<div class="g"><div class="gt">${esc(d.file_name)}</div><div class="why">${esc(d.summary_markdown)}</div></div>`).join("") : "";

  const b = c.briefing || {highlights: [], missing_information: []};
  const hls = b.highlights.length ? b.highlights.map((h, i) => `
    <div class="hl"><span class="num">${i + 1}</span><span class="ht">${esc(h.title)}</span>
      <div class="hb">${esc(h.body)}</div>
      ${h.suggested_actions.length ? `<ul>${h.suggested_actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
      <div>${h.source_refs.map(r => `<button class="ref" data-id="${esc(r.id)}">${esc(r.type)} · ${esc(r.id)}</button>`).join("")}</div>
      ${h.source_refs.filter(r => r.excerpt).map(r => `<div class="excerpt">${esc(r.excerpt)}</div>`).join("")}
    </div>`).join("") : '<div class="empty">하이라이트 없음</div>';

  const verdictClass = v => "v-" + v;
  const req = c.required.length ? c.required.map(t => `
    <div class="g ${verdictClass(t.verdict)}">
      <div class="gt"><span class="vl">${VERDICT[t.verdict]}</span>${esc(t.label)}
        ${t.requires_rag ? '<span class="badge b-rag">RAG 필요</span>' : '<span class="badge b-recent">최근 3건 안</span>'}
        ${t.hi ? `<span class="badge b-ev">하이라이트 ${t.hi}</span>` : ""}</div>
      <div class="why">${esc(t.intent)}</div>
      ${t.reason ? `<div class="why"><b>판정:</b> ${esc(t.reason)}</div>` : ""}
      <div>${(t.evidence || []).map(id => `<button class="ref" data-id="${esc(id)}">${esc(id)}</button>`).join("")}</div>
    </div>`).join("") : '<div class="empty">필수 주제 없음 (첫 미팅)</div>';

  const mustNot = c.mustNot.length ? `<div class="sec">다시 올리면 안 되는 해결된 사안</div>` + c.mustNot.map(t => `
    <div class="g ${t.appeared ? "v-bad" : "v-covered"}"><div class="gt">
      <span class="vl">${t.appeared ? "재등장" : "정상"}</span>${esc(t.label)}</div>
      ${t.appeared && t.reason ? `<div class="why">${esc(t.reason)}</div>` : ""}</div>`).join("") : "";

  const changed = c.changed.length ? `<div class="sec">값이 바뀐 항목 — 최신 값만 써야 함</div>` + c.changed.map(t => `
    <div class="g ${t.stale ? "v-bad" : "v-covered"}"><div class="gt">
      <span class="vl">${t.stale ? "옛 값 사용" : "정상"}</span>${esc(t.from)} → <b>${esc(t.to)}</b></div></div>`).join("") : "";

  const allowed = c.allowed.length ? `<div class="sec">다뤄도 되는 주제</div>` +
    c.allowed.map(t => `<div class="g"><div class="gt">${esc(t.label)}</div></div>`).join("") : "";
  const stalled = c.stalled.length ? `<div class="sec">정체 중인 딜</div>` +
    c.stalled.map(s => `<div class="g"><div class="gt">${esc(s.title)} · ${s.stalled_rounds}회 정체</div></div>`).join("") : "";
  const critical = c.critical.length ? `<div class="sec" style="color:var(--red)">중대 오류</div>` +
    c.critical.map(x => `<div class="g v-bad">${esc(x)}</div>`).join("") : "";

  main.innerHTML = `
    <div class="casehead">
      <h2>${esc(c.chainName)} · 미팅 ${c.depth}회차 브리핑 <span class="pct ${grade(c.percent)}">${c.percent}%</span></h2>
      <div class="stat">${esc(c.chainKind)} · ${c.total}/${c.max}점 · 이전 보고서 ${c.reports.length}건 ·
        도구 ${c.deterministic ? "없음 (첫 미팅 고정 문구)" : esc(c.tools.join(" → ") || "없음")} ·
        RAG ${c.rag}회${c.ragMin ? ` (최소 ${c.ragMin}회 필요)` : ""} · 낭비 하이라이트 ${c.offTopic}</div>
      <div class="stat" style="margin-top:6px">${esc(c.summary)}</div>
      <div class="crit">${crit}</div>
    </div>
    <div class="cols">
      <section class="col"><h3>① 원문 <span class="step">브리핑이 받은 보고서</span></h3>
        <div class="colbody">
          <div class="meeting"><b>다음 미팅</b> ${esc(m.title)} · ${esc((m.starts_at || "").slice(0, 16).replace("T", " "))}<br>
            대상자 ${esc(contact.name)} ${esc(contact.department)} ${esc(contact.job_title)}<br>
            진행 중인 딜 ${c.deals.length ? c.deals.map(d => esc(d.title) + " (" + esc(d.stage_code) + ")").join(", ") : "없음"}</div>
          ${reports}${docs}
        </div></section>
      <section class="col"><h3>② 실제 브리핑 <span class="step">에이전트 출력</span></h3>
        <div class="colbody">${hls}
          <div class="sec">확인이 필요한 정보</div>
          <ul class="miss">${(b.missing_information || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>없음</li>"}</ul>
        </div></section>
      <section class="col"><h3>③ 골든 정답 <span class="step">그 시점에 다뤄야 할 것</span></h3>
        <div class="colbody">${critical}<div class="sec">반드시 다뤄야 할 주제</div>${req}${changed}${mustNot}${stalled}${allowed}</div></section>
    </div>`;

  main.querySelectorAll(".ref").forEach(btn => btn.onclick = () => {
    const el = document.getElementById("rep-" + btn.dataset.id);
    if (!el) return;
    el.open = true; el.scrollIntoView({behavior: "smooth", block: "center"});
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
  });
  window.scrollTo({top: 0});
}

renderFilters();
renderList();
const first = visible()[0];
if (first) { state.sel = first.name; renderList(); renderCase(first); }
</script>
</body>
</html>
